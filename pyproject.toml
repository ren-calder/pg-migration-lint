[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pg-migration-lint"
dynamic = ["version"]
description = "Static checker for Java-to-PostgreSQL migration pitfalls in JDBC code, native SQL, SQL files and Liquibase changelogs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ren Calder" }]
maintainers = [{ name = "Ren Calder" }]
keywords = ["postgresql", "java", "jdbc", "liquibase", "migration", "linter", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pgmig-lint = "pg_migration_lint.cli:main"

[project.urls]
Homepage = "https://github.com/ren-calder/pg-migration-lint"
Issues = "https://github.com/ren-calder/pg-migration-lint/issues"

[tool.hatch.version]
path = "src/pg_migration_lint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pg_migration_lint"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
